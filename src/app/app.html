<app-floating-hearts />

@if (!entered()) {
  <app-intro-gate (tapped)="startMusic()" (opened)="enter()" />
}

<main class="page" [class.ready]="entered()">
  <app-hero />
  <app-gallery />
  <app-reasons />
  <app-timeline />
  <app-cake />
  <app-letter />

  <footer class="footer">
    <p class="line">{{ footer }}</p>
    <p class="sig">{{ from }} 💗 {{ name }}</p>
  </footer>
</main>

<app-music-toggle />
